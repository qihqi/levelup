[project]
name = "levelup"
version = "0.1.0"
description = "实时四人双副牌升级 / Tractor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
build = ["build>=1,<2"]

[project.scripts]
levelup-serve = "levelup.cli:main"
levelup-simulate = "levelup.simulation:main"
levelup-benchmark = "levelup.bench_ai:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["levelup", "levelup.*"]
namespaces = false

[tool.setuptools.data-files]
"share/levelup/static" = ["static/*.html", "static/*.css", "static/*.js"]
